[functions.create-order]
# Called by the public checkout (no logged-in user) and by the voice agent's
# webhook, neither of which carries a Supabase user JWT.
verify_jwt = false

[functions.whatsapp-webhook]
# Called by Twilio's webhook, which doesn't carry a Supabase user JWT either.
verify_jwt = false

[functions.customer-lookup]
# Called by the ElevenLabs voice agent's Server Tool, no Supabase user JWT.
verify_jwt = false

[functions.send-order-notification]
# Called by the authenticated internal outbox dispatcher, no Supabase user JWT.
verify_jwt = false

[functions.messaging-dispatcher]
# Called by the versioned scheduler; validates INTERNAL_WEBHOOK_SECRET itself.
verify_jwt = false

[functions.buscar-producto]
# Called by the ElevenLabs voice agent's Server Tool, no Supabase user JWT.
verify_jwt = false

[functions.buscar-sucursal-cercana]
# Called by the voice tool; the function validates VOICE_TOOL_SECRET itself.
verify_jwt = false

[functions.registrar-contacto]
# Called by the ElevenLabs voice agent; the function validates VOICE_TOOL_SECRET.
verify_jwt = false

[functions.whatsapp-widget-chat]
# Called by the public/demo page's chat widget (src/components/WidgetWhatsApp.tsx),
# which has no logged-in Supabase user — same shape as whatsapp-webhook.
verify_jwt = false
